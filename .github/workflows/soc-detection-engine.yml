name: Verify SOC Detection Engine
on:
  pull_request:
    paths:
      - 'projects/soc-detection-engine/**'
      - '.github/workflows/soc-detection-engine.yml'
  push:
    branches: [main]
    paths:
      - 'projects/soc-detection-engine/**'
      - '.github/workflows/soc-detection-engine.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-soc-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify offline parsing and detection rules
        working-directory: projects/soc-detection-engine
        run: python -m unittest discover -s soclab -p 'test_*.py' -v
      - name: Smoke-test both fictional sample batches
        working-directory: projects/soc-detection-engine
        run: |
          python -m soclab.cli --file fixtures/synthetic-sec01.log > /tmp/soc-alerts.json
          python -m soclab.cli --file fixtures/synthetic-benign.log > /tmp/soc-benign.json
          python - <<'PY'
          import json
          with open('/tmp/soc-alerts.json', encoding='utf-8') as f:
              suspicious = json.load(f)
          with open('/tmp/soc-benign.json', encoding='utf-8') as f:
              benign = json.load(f)
          assert len(suspicious['alerts']) == 4, suspicious
          assert benign['alerts'] == [], benign
          print('Synthetic detection and benign regression smoke tests: PASS')
          PY
