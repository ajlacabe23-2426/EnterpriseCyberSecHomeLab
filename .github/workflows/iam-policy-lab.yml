name: Verify IAM Policy Lab
on:
  pull_request:
    paths:
      - 'projects/iam-policy-lab/**'
      - '.github/workflows/iam-policy-lab.yml'
  push:
    branches: [main]
    paths:
      - 'projects/iam-policy-lab/**'
      - '.github/workflows/iam-policy-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-iam-policy-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test explainable IAM policy decisions
        working-directory: projects/iam-policy-lab
        run: python -m unittest discover -s . -p 'test_*.py' -v
      - name: Verify standalone fictional demo CLI
        working-directory: projects/iam-policy-lab
        run: python -m iamlab
