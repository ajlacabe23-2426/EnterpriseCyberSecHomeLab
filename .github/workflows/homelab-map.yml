name: Verify homelab evidence map
on:
  push:
    paths:
      - 'projects/homelab-map/**'
      - '.github/workflows/homelab-map.yml'
      - 'docs/MAC_ACCEPTANCE_AND_INTEGRATION_2026-10-11.md'
      - 'docs/purple-team-workflow-validation-2026-09-04.md'
      - 'docs/ENTERPRISE_CYBER_LAB_V2.md'
  pull_request:
    paths:
      - 'projects/homelab-map/**'
      - '.github/workflows/homelab-map.yml'
      - 'docs/MAC_ACCEPTANCE_AND_INTEGRATION_2026-10-11.md'
      - 'docs/purple-team-workflow-validation-2026-09-04.md'
      - 'docs/ENTERPRISE_CYBER_LAB_V2.md'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Offline read-only HTTP and evidence tests
        working-directory: projects/homelab-map
        run: python -B -m unittest labmap.test_server -v
      - name: JavaScript syntax and model checks
        run: |
          node --check projects/homelab-map/labmap/public/app.js
          node --check projects/homelab-map/labmap/public/core.mjs
          node --test projects/homelab-map/tests.mjs
      - name: Real Chromium loopback acceptance
        env:
          RUN_BROWSER_ACCEPTANCE: '1'
          CHROME_BIN: /usr/bin/google-chrome
        run: |
          command -v google-chrome
          node --test projects/homelab-map/tests/browser.test.mjs
